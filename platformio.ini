; Odtwarzacz plikow SID (muzyka z Commodore 64) dla ESP32
; Wybor plytki: pio run -e esp32dev   albo   pio run -e esp32s3-n16r8

[env]
platform = espressif32 @ 6.9.0
framework = arduino
monitor_speed = 115200
; pokazuj wpisywany tekst i wysylaj komende Enterem
monitor_echo = yes
monitor_eol = LF
board_build.filesystem = littlefs

; Silnik emulacji SID (dopisz w build_flags danego srodowiska):
;   -DSID_ENGINE=0              wlasny, lekki silnik
;   -DSID_ENGINE=1              reSID 0.16 - wierniejszy dzwiek (domyslnie)
;   -DSID_RESID_INTERPOLATE=1   reSID z interpolacja (lepiej, ale duzo wolniej)
;   -DSID_ENGINE=2              prawdziwy uklad 6581/8580 (model i piny: include/config.h,
;                               schemat: docs/REAL_SID.md)
; Zrodla plikow (pamiec flash jest zawsze):
;   -DPLAYER_SOURCE_SD=1        karta SD przez SPI (piny: include/config.h, SD_PIN_*)
;   -DPLAYER_SOURCE_DEEPSID=1   portal DeepSID przez internet (wymaga WiFi)
;   -DUSE_LCD=1                 LCD ILI9341 + enkoder + przyciski (tylko ESP32-S3,
;                               srodowisko esp32s3-n16r8-lcd, opis: docs/LCD.md)

; Klasyczny ESP32 (ESP32-WROOM-32, DevKit V1)
[env:esp32dev]
board = esp32dev
board_build.f_cpu = 240000000L
build_flags =
    -O2
    -DSID_ENGINE=1
    ; Odkomentuj, aby uzyc wbudowanego DAC (GPIO25) zamiast zewnetrznego DAC I2S:
    ; -DSID_OUTPUT_INTERNAL_DAC
    ; Karta SD (CS 5, MOSI 23, SCK 18, MISO 19):
    ; -DPLAYER_SOURCE_SD=1
    ; DeepSID przez internet:
    ; -DPLAYER_SOURCE_DEEPSID=1

; ESP32-S3-WROOM-1 N16R8: 16 MB flash (QIO), 8 MB PSRAM (OPI)
; S3 nie ma wbudowanego DAC - potrzebny zewnetrzny DAC I2S.
; Piny GPIO26-37 sa zajete przez flash/PSRAM, dlatego I2S jest na GPIO4/5/6.
[env:esp32s3-n16r8]
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -O2
    -DSID_ENGINE=1
    -DBOARD_HAS_PSRAM
    -DI2S_PIN_BCK=4
    -DI2S_PIN_WS=5
    -DI2S_PIN_DATA=6
    ; karta SD przez SPI: CS 10, MOSI 11, SCK 12, MISO 13
    -DPLAYER_SOURCE_SD=0
    ; portal DeepSID przez internet (HVSC)
    -DPLAYER_SOURCE_DEEPSID=1
    ; konsola dziala na obu gniazdach: "USB" (natywny) i "COM" (UART)
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 N16R8 + LCD ILI9341 2.8" (TFT_eSPI), enkoder i dwa przyciski.
; Opis, schemat podlaczenia i sterowanie: docs/LCD.md. Pozostale piny: include/config.h (LCD_PIN_*).
; Wyswietlacz ma wlasna magistrale SPI (HSPI), osobna od karty SD (10-13).
[env:esp32s3-n16r8-lcd]
extends = env:esp32s3-n16r8
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
build_flags =
    ${env:esp32s3-n16r8.build_flags}
    -DUSE_LCD=1
    ; 1 = enkoder + przyciski Wstecz (GPIO1) i Wybierz (GPIO39), 0 = tylko enkoder
    -DLCD_BUTTONS=1
    ; konfiguracja TFT_eSPI bez edycji User_Setup.h w bibliotece
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_SCLK=14
    -DTFT_MOSI=21
    -DTFT_MISO=-1
    -DTFT_CS=9
    -DTFT_DC=47
    ; RESET wyswietlacza do 3V3 (albo EN) - reset programowy
    -DTFT_RST=-1
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    ; gdy kolory sa zamienione (czerwony <-> niebieski), odkomentuj:
    ; -DTFT_RGB_ORDER=TFT_BGR
